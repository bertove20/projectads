patch:
  summary: Edit creative
  tags:
    - creatives
  description: |
    Partial update: send only the fields you change, the fields you omit keep their current values.
    The `required` list of the schema applies to campaign creation, not to this request.
    To clear an optional field (`badge`, `buttons`), send it as `null`.
    Changing `icon`, `image`, `title`, `description` or `buttons` sends the creative to moderation.
    Display Interstitial creatives still require `image` in every request.
  operationId: adv-creatives-edit
  parameters:
    - in: path
      name: creativeId
      description: Numeric ID of the creative
      schema:
        type: integer
      required: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/CampaignCreative.yaml'
        examples:
          "Push creative":
            value:
              status: 1
              frequency: 3
              capping: 86400
              click_frequency: 0
              click_capping: 0
              title: "Creative one"
              description: "This is the first creative"
              is_auto: false
              icon: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADAAQMAAABoEv5EAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAANQTFRF////p8QbyAAAABxJREFUeJztwTEBAAAAwqD1T20ND6AAAAAA4NcAEsAAAdLBrL4AAAAASUVORK5CYII="
              image: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWgAAADwAQMAAAAXaWwMAAAAAXNSR0IB2cksfwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAANQTFRF////p8QbyAAAACFJREFUeJztwQENAAAAwqD3T20PBxQAAAAAAAAAAAAA/BgrIAAB/BxM7QAAAABJRU5ErkJggg=="

              default_button_disabled: false
              buttons:
                - name: "Custom text"
          "Telegram":
            value:
              status: 1
              click_frequency: 2
              click_capping: 86400
              image: "data:image/png;base64,"
              title: "Creative one"
              description: "This is the first creative"
              icon: "data:image/png;base64,"
              buttons:
                - name: "I am button"
              default_button_disabled: false
              badge: null
  responses:
    '200':
      $ref: '../../../components/responses/Success.yaml'
    '401':
      $ref: '../../../../common/components/responses/Unauthorized.yaml'
    '400':
      $ref: '../../../../common/components/responses/ValidationErrors.yaml'
    '429':
      $ref: '../../../../common/components/responses/RateLimit.yaml'
