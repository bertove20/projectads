put:
  summary: Start one or more campaigns
  tags:
    - campaigns
  description: Start one or more campaigns
  operationId: adv-campaigns-play
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            campaign_ids:
              type: array
              items:
                type: integer
          example:
            campaign_ids: [ 111, 222 ]
  responses:
    '200':
      description: A JSON object
      headers:
        X-Request-Id:
          $ref: '../../../../common/components/headers/xRequestId.yaml'
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Message.
              errors:
                type: object
                description: Array of errors by campaignID key.
    '400':
      $ref: '../../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../../../common/components/responses/Unauthorized.yaml'
    '429':
      $ref: '../../../../common/components/responses/RateLimit.yaml'
