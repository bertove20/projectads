summary: Getting the list of rates for list of campaigns
tags:
  - campaigns
description: Getting the list of rates for list of campaigns (including finished rates)
operationId: adv-campaigns-bulk-get-rates
parameters:
  - in: query
    name: campaign_ids[]
    description: Array of numeric IDs of the campaigns
    schema:
      $ref: '../../../components/schemas/CampaignIds.yaml'
    required: true
  - in: query
    name: page
    description: Result's page number
    schema:
      $ref: '../../../components/schemas/PageNumber.yaml'
    required: false
  - in: query
    name: page_size
    description: Result's page size
    schema:
      $ref: '../../../components/schemas/PageSize.yaml'
    required: false
  - in: query
    name: only_active
    description: >
      Filter zone rates by active:
       * `0` - All rates
       * `1` - Only active rates
    schema:
      type: integer
      enum: [ 0, 1 ]
      default: 0
    required: false

responses:
  '200':
    description: List of rates (including finished rates)
    headers:
      X-Request-Id:
        $ref: '../../../../common/components/headers/xRequestId.yaml'
    content:
      application/json:
        schema:
          type: object
          properties:
            result:
              type: array
              items:
                $ref: '../../../components/schemas/Rate.yaml'
            meta:
              $ref: '../../../../common/components/schemas/Meta.yaml'
          example:
            result:
              - id: 12345
                campaign_id: 12355
                countries: [ 'us','ru' ]
                amount: 200
                started_at: 1513864800
                finished_at: 1513868399
              - id: 12346
                campaign_id: 12355
                countries: [ 'it','us' ]
                amount: 200
                started_at: 1513864800
                finished_at: null
            meta:
              total_items: 2
              total_pages: 1
              page_size: 100
              page: 1
  '401':
    $ref: '../../../../common/components/responses/Unauthorized.yaml'
  '400':
    $ref: '../../../../common/components/responses/ValidationErrors.yaml'
  '429':
    $ref: '../../../../common/components/responses/RateLimit.yaml'
