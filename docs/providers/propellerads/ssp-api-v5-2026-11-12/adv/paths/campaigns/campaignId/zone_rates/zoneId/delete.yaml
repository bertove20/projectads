summary: Close rates by zone
tags:
  - campaigns
description: Close rates by zone. If rate already started, it won't be deleted, just finished_at value will be updated.
operationId: adv-campaigns-delete-rates-by-zone
parameters:
  - in: path
    name: campaignId
    description: Numeric ID of the campaign
    schema:
      type: integer
    required: true
  - in: path
    name: zoneId
    description: Numeric ID of the zone
    schema:
      type: integer
    required: true
responses:
  '200':
    $ref: '../../../../../components/responses/Success.yaml'
  '401':
    $ref: '../../../../../../common/components/responses/Unauthorized.yaml'
  '400':
    $ref: '../../../../../../common/components/responses/ValidationErrors.yaml'
  '429':
    $ref: '../../../../../../common/components/responses/RateLimit.yaml'
