get:
  summary: Get available collection items
  tags:
    - collections
  description: Get available collection items
  operationId: collections-items
  parameters:
    - in: path
      name: type
      description: Type of collection
      schema:
        type: string
      required: true
  responses:
    '200':
      description: Returned JSON array with collection items
      headers:
        X-Request-Id:
          $ref: '../../../../common/components/headers/xRequestId.yaml'
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/CollectionResult.yaml'
    '401':
      $ref: '../../../../common/components/responses/Unauthorized.yaml'
    '400':
      $ref: '../../../../common/components/responses/ValidationErrors.yaml'
    '429':
      $ref: '../../../../common/components/responses/RateLimit.yaml'
